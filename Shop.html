<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>HUGS Shop</title>

<link rel="stylesheet" href="/styles.css" />

<style>
/* =========================
   SHOP BASE THEME (MATCH HOME)
========================= */

body {
  margin: 0;
  background: radial-gradient(circle at top, #0b1b3a, #050A1F);
  color: white;
  font-family: Arial, sans-serif;
}

.wrap {
  max-width: 1200px;
  margin: auto;
  padding: 40px 20px;
}

/* =========================
   HERO
========================= */

.hero {
  text-align: center;
  margin-bottom: 40px;
}

.hero-actions {
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
}

.btn {
  padding: 10px 16px;
  border-radius: 999px;
  text-decoration: none;
  color: white;
  border: 1px solid rgba(255,255,255,0.2);
}

.btn.primary {
  background: linear-gradient(90deg, #2F80FF, #00C2FF);
  box-shadow: 0 0 20px rgba(0,194,255,0.5);
  font-weight: 800;
}

/* =========================
   GRID
========================= */

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 22px;
}

/* =========================
   CARD STYLE (HOME MATCH)
========================= */

.card {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(0,194,255,0.15);
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 0 25px rgba(0,194,255,0.08);
  transition: 0.3s ease;
}

.card:hover {
  transform: translateY(-4px);
  box-shadow: 0 0 45px rgba(0,194,255,0.25);
}

.card-img img {
  width: 100%;
  display: block;
}

.card-body {
  padding: 14px;
}

.card-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.price {
  color: #5AF0FF;
  font-weight: bold;
}

.card-actions {
  display: flex;
  gap: 10px;
  margin-top: 10px;
}

/* =========================
   FEATURED HERO CARD
========================= */

.featured {
  grid-column: 1 / -1;
  position: relative;
  border-radius: 18px;
  overflow: hidden;
  border: 2px solid rgba(0,194,255,0.5);
  box-shadow: 0 0 55px rgba(0,194,255,0.25);
}

.featured img {
  width: 100%;
  height: 420px;
  object-fit: cover;
}

.featured-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(5,10,31,0.95), rgba(0,194,255,0.25));
  display: flex;
  align-items: flex-end;
  padding: 20px;
}

/* =========================
   FLOATING EFFECTS LAYERS
========================= */

.blue-hearts-container,
.floating-logo-layer {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
}

.blue-heart {
  position: absolute;
  bottom: -20px;
  color: #00C2FF;
  animation: floatUp linear forwards;
}

.floating-logo {
  position: absolute;
  bottom: -60px;
  opacity: 0.25;
  animation: drift linear forwards;
}

@keyframes floatUp {
  to {
    transform: translateY(-110vh);
    opacity: 0;
  }
}

@keyframes drift {
  to {
    transform: translateY(-120vh) rotate(360deg);
    opacity: 0;
  }
}
</style>

</head>

<body>

<!-- FLOATING FX LAYERS -->
<div class="gold-particles"></div>
<div class="blue-hearts-container" id="blueHearts"></div>
<div class="floating-logo-layer" id="logoLayer"></div>

<!-- HEADER -->
<header class="site-header">
  <div class="wrap header-inner">

    <a class="brand" href="/">
      <span class="brand-mark">HUGS</span>
      <span class="brand-sub">Help Under Good Service</span>
    </a>

    <nav class="nav">
      <a href="/" class="nav-link">Home</a>
      <a href="/shop.html" class="nav-link active">Shop</a>
      <a href="/open-store.html" class="nav-link">Open Store</a>
    </nav>

  </div>
</header>

<main class="wrap">

<!-- HERO -->
<section class="hero">
  <h1>HUGS Shop</h1>
  <p class="muted">Healing apparel built for community connection.</p>

  <div class="hero-actions">
    <a class="btn primary" href="/open-store.html">Open Store</a>
    <a class="btn" href="#products">View Products</a>
  </div>
</section>

<!-- PRODUCTS -->
<section id="products" class="section">

  <div id="productGrid" class="grid"></div>

</section>

</main>

<!-- PRODUCTS DATA -->
<script src="/products.js"></script>

<!-- CART + UI RENDER -->
<script>
document.getElementById("year")?.append(new Date().getFullYear());

const grid = document.getElementById("productGrid");

/* =========================
   FEATURED FIRST
========================= */

const featured = {
  id: "time4healing",
  name: "Time 4 Healing Hoodie",
  price: 88,
  description: "Featured Drop • Healing Collection",
  image: "/assets/time-4-healing-hoodie.JPEG"
};

function card(p){
  return `
  <article class="card">

    <div class="card-img">
      <img src="${p.image}" />
    </div>

    <div class="card-body">

      <div class="card-top">
        <h3>${p.name}</h3>
        <div class="price">$${p.price}</div>
      </div>

      <p class="muted">${p.description}</p>

      <div class="card-actions">
        <a class="btn primary" href="/open-store.html">Buy</a>
        <a class="btn" href="/open-store.html">View</a>
      </div>

    </div>

  </article>`;
}

grid.innerHTML =
  card(featured) +
  (products ? products.map(card).join("") : "");
</script>

<!-- FLOATING HEARTS + LOGOS -->
<script>

const hearts = document.getElementById("blueHearts");
const logos = document.getElementById("logoLayer");

/* HEARTS */
function createHeart(){
  if(!hearts) return;

  const el = document.createElement("div");
  el.className = "blue-heart";
  el.innerHTML = "❤";

  el.style.left = Math.random()*100+"vw";
  el.style.fontSize = (10+Math.random()*16)+"px";
  el.style.animationDuration = (9+Math.random()*10)+"s";

  hearts.appendChild(el);
  setTimeout(()=>el.remove(),20000);
}

setInterval(createHeart,1100);

/* LOGOS */
function createLogo(){
  if(!logos) return;

  const img = document.createElement("img");
  img.src = "/assets/hugs-gold-logo.png";
  img.className = "floating-logo";

  img.style.left = Math.random()*100+"vw";
  img.style.width = (26+Math.random()*28)+"px";
  img.style.animationDuration = (11+Math.random()*9)+"s";

  logos.appendChild(img);
  setTimeout(()=>img.remove(),22000);
}

setInterval(createLogo,1500);

</script>

</body>
</html>
