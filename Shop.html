<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HUGS Shop</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #0a0a0a;
      color: #fff;
    }

    /* HEADER */
    .header {
      width: 100%;
      height: 220px;
      background: url('https://your-image-link.com/banner.jpg') center/cover no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .header img {
      height: 120px;
      cursor: pointer;
      transition: 0.3s;
    }

    .header img:hover {
      transform: scale(1.05);
    }

    /* HERO TEXT */
    .hero {
      text-align: center;
      padding: 40px 20px;
    }

    .hero h1 {
      font-size: 36px;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }

    .hero p {
      color: #aaa;
      font-size: 16px;
    }

    /* PRODUCT CARD */
    .product {
      max-width: 400px;
      margin: 40px auto;
      background: #111;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 0 20px rgba(0,0,0,0.6);
    }

    .product img {
      width: 100%;
      border-radius: 10px;
    }

    .product h2 {
      margin: 15px 0 5px;
    }

    .price {
      color: #00ffae;
      font-size: 20px;
      margin-bottom: 20px;
    }

    /* BUTTONS */
    .btn-container {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 12px 20px;
      border-radius: 30px;
      border: none;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }

    .buy {
      background: #00ffae;
      color: #000;
    }

    .buy:hover {
      background: #00cc8a;
    }

    .back {
      background: transparent;
      border: 1px solid #fff;
      color: #fff;
    }

    .back:hover {
      background: #fff;
      color: #000;
    }

    /* FOOTER */
    .footer {
      text-align: center;
      padding: 30px;
      font-size: 12px;
      color: #666;
    }

    @media (max-width: 600px) {
      .hero h1 {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER (Clickable Logo) -->
  <div class="header">
    <a href="https://hugslinks.com">
      <img src="https://your-logo-link.com/logo.png" alt="HUGS Logo">
    </a>
  </div>

  <!-- HERO -->
  <div class="hero">
    <h1>HUGS COLLECTION</h1>
    <p>Wear the message. Support the mission.</p>
  </div>

  <!-- PRODUCT -->
  <div class="product">
    <img src="https://your-product-image.com/hug-hoodie.jpg" alt="HUGS Hoodie">

    <h2>HUGS Hoodie</h2>
    <div class="price">$45</div>

    <div class="btn-container">
      <a href="https://buy.stripe.com/dRm9ASa56deM7GvaIM8ww00">
        <button class="btn buy">Buy Now</button>
      </a>

      <a href="https://hugslinks.com/send-a-hug">
        <button class="btn back">Send a Hug</button>
      </a>
    </div>
  </div>

  <!-- FOOTER -->
  <div class="footer">
    © 2026 HUGS — Help Under Good Service
  </div>

</body>
</html>
