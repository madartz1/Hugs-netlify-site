<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Send a Hug | HUGS</title>

  <style>
    :root{
      --bg:#F7F6F3;
      --paper:#FFFDF9;
      --text:#2B2B2B;
      --muted:#6B625C;
      --navy:#0B2A4A;
      --warm:#8B3A2B;
      --warm-2:#B85C46;
      --line:#E8DDD3;
      --accent:#F2E8D8;
      --shadow:0 12px 35px rgba(0,0,0,.08);
      --radius:18px;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      font-family:Arial, Helvetica, sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    a{color:inherit;text-decoration:none}

    .wrap{
      width:min(1100px, calc(100% - 32px));
      margin:0 auto;
    }

    header{
      position:sticky;
      top:0;
      background:rgba(247,246,243,.95);
      border-bottom:1px solid var(--line);
      padding:14px 0;
    }

    .brand{
      font-weight:900;
      color:var(--warm);
      letter-spacing:.1em;
    }

    h1{
      font-size:2.5rem;
      color:var(--navy);
      margin:10px 0;
    }

    .btn{
      padding:14px 18px;
      border-radius:999px;
      border:none;
      cursor:pointer;
      font-weight:700;
    }

    .primary{
      background:var(--warm);
      color:#fff;
    }

    .secondary{
      background:transparent;
      border:1px solid var(--navy);
      color:var(--navy);
    }

    .section{
      padding:30px 0;
    }

    .card{
      background:var(--paper);
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:20px;
    }

    input, textarea, select{
      width:100%;
      padding:12px;
      margin-top:6px;
      border-radius:12px;
      border:1px solid #ddd;
    }

    label{
      font-weight:700;
      color:var(--navy);
      display:block;
      margin-top:12px;
    }

    /* 🔥 HUG HOUSE SECTION */
    .hug-house{
      text-align:center;
      padding:18px;
      margin:20px 0;
      border-radius:16px;
      background:var(--accent);
    }

    .hug-house img{
      width:110px;
      margin-top:10px;
      cursor:pointer;
      transition:.2s;
    }

    .hug-house img:hover{
      transform:scale(1.08);
    }

    .review-preview{
      margin-top:12px;
      padding:12px;
      background:#fff;
      border-radius:12px;
      font-size:.9rem;
    }

    .price{
      display:flex;
      justify-content:space-between;
      align-items:center;
      background:var(--accent);
      padding:14px;
      border-radius:14px;
      margin:20px 0;
      font-weight:800;
    }

  </style>
</head>

<body>

<header>
  <div class="wrap">
    <span class="brand">HUGS</span>
  </div>
</header>

<main class="wrap">

  <h1>Send a Hug ❤️</h1>

  <div class="card">

    <label>Your Name</label>
    <input id="senderName">

    <label>Your Email</label>
    <input id="senderEmail">

    <label>Recipient Name</label>
    <input id="recipientName">

    <label>Recipient Email</label>
    <input id="recipientEmail">

    <label>Message</label>
    <textarea id="message"></textarea>

    <!-- 🔥 HUG HOUSE TRUST BLOCK -->
    <div class="hug-house">
      <div><strong>Real Hugs. Real Impact ❤️</strong></div>
      <div style="font-size:.9rem;color:#666;">
        See how people are using HUGS in the community
      </div>

      <a href="https://hugsreviews.netlify.app/" target="_blank">
        <img src="hug-house-logo.png" alt="Hug House">
      </a>

      <div class="review-preview">
        ⭐⭐⭐⭐⭐ “This helped me when I needed it most.”
      </div>
    </div>

    <div class="price">
      <span>Digital Hug Contribution</span>
      <span>$10</span>
    </div>

    <button class="btn primary" onclick="pay()">
      Pay $10 & Send Hug ❤️
    </button>

    <button class="btn secondary" style="margin-top:10px;" onclick="preview()">
      Preview Hug Card 💌
    </button>

  </div>

</main>

<script>
function pay() {
  const senderName = document.getElementById("senderName").value;
  const senderEmail = document.getElementById("senderEmail").value;
  const recipientName = document.getElementById("recipientName").value;
  const recipientEmail = document.getElementById("recipientEmail").value;
  const message = document.getElementById("message").value;

  if(!senderName || !senderEmail || !recipientName || !recipientEmail){
    alert("Fill all required fields");
    return;
  }

  localStorage.setItem("hugData", JSON.stringify({
    senderName,
    senderEmail,
    recipientName,
    recipientEmail,
    message
  }));

  async function pay() {
  const senderName = document.getElementById("senderName").value;
  const senderEmail = document.getElementById("senderEmail").value;
  const recipientName = document.getElementById("recipientName").value;
  const recipientEmail = document.getElementById("recipientEmail").value;
  const message = document.getElementById("message").value;

  if(!senderName || !senderEmail || !recipientName || !recipientEmail){
    alert("Fill all required fields");
    return;
  }

  // save draft info locally
  localStorage.setItem("hugData", JSON.stringify({
    senderName,
    senderEmail,
    recipientName,
    recipientEmail,
    message
  }));

  try {
    // 🔥 NEW STRIPE CHECKOUT FLOW
    const res = await fetch("/.netlify/functions/create-checkout");
    const data = await res.json();

    if (!data.url) {
      alert("Checkout failed. Try again.");
      return;
    }

    // redirect to Stripe Checkout session
    window.location.href = data.url;

  } catch (err) {
    console.error(err);
    alert("Something went wrong. Please try again.");
  }
}
}

function preview(){
  window.open("https://hugscard.netlify.app/", "_blank");
}
</script>

</body>
</html>
