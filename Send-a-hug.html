<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Send a Hug | HUGS</title>

  <style>
    body{
      margin:0;
      font-family:Arial, sans-serif;
      background:#F7F6F3;
      color:#2B2B2B;
    }

    .wrap{
      width:min(900px, calc(100% - 32px));
      margin:0 auto;
      padding:40px 0;
      text-align:center;
    }

    header{
      padding:20px 0;
      border-bottom:1px solid #E8DDD3;
      background:#F7F6F3;
      position:sticky;
      top:0;
    }

    .brand{
      font-weight:900;
      color:#8B3A2B;
      letter-spacing:.1em;
    }

    h1{
      color:#0B2A4A;
      font-size:2.6rem;
      margin:20px 0 10px;
    }

    p{
      color:#6B625C;
      max-width:600px;
      margin:0 auto 20px;
    }

    .card{
      background:#FFFDF9;
      padding:30px;
      border-radius:18px;
      box-shadow:0 12px 35px rgba(0,0,0,.08);
      margin-top:30px;
    }

    .btn{
      display:block;
      width:100%;
      padding:16px;
      border:none;
      border-radius:999px;
      font-size:16px;
      font-weight:800;
      cursor:pointer;
      margin-top:12px;
    }

    .primary{
      background:#8B3A2B;
      color:white;
    }

    .primary:hover{
      background:#B85C46;
    }

    .secondary{
      background:transparent;
      border:1px solid #0B2A4A;
      color:#0B2A4A;
    }

    .trust{
      margin-top:25px;
      background:#F2E8D8;
      padding:20px;
      border-radius:16px;
    }

    .trust img{
      width:100px;
      margin-top:10px;
    }

    .note{
      font-size:12px;
      color:#777;
      margin-top:10px;
    }
  </style>
</head>

<body>

<header>
  <div class="wrap">
    <div class="brand">HUGS</div>
  </div>
</header>

<main class="wrap">

  <h1>Send a Hug ❤️</h1>

  <p>
    No forms. No pressure. Just a real moment of care.
    Pay once — then share your Hug instantly.
  </p>

  <div class="card">

    <button class="btn primary" onclick="pay()">
      Pay $10 & Create Your Hug ❤️
    </button>

    <button class="btn secondary" onclick="preview()">
      Preview Hug Experience 💌
    </button>

    <div class="trust">
      <div><strong>Trusted by the HUGS community ❤️</strong></div>
      <div style="font-size:13px;color:#666;">
        Real people sharing real emotional support
      </div>

      <img src="/assets/hug-house-logo.jpg" alt="Hug House">

    </div>

    <div class="note">
      After payment you’ll get a unique Hug link to share instantly.
    </div>

  </div>

</main>

<script>

async function pay() {
  const btn = document.querySelector(".primary");
  btn.innerText = "Opening secure checkout...";

  try {
    const res = await fetch("/.netlify/functions/create-checkout");
    const data = await res.json();

    if (!data.url) {
      alert("Checkout failed. Try again.");
      btn.innerText = "Pay $10 & Send Hug ❤️";
      return;
    }

    // smooth UX transition
    setTimeout(() => {
      window.location.href = data.url;
    }, 500);

  } catch (err) {
    console.error(err);
    alert("Something went wrong. Try again.");
    btn.innerText = "Pay $10 & Send Hug ❤️";
  }
}

function preview(){
  window.open("https://hugscard.netlify.app/", "_blank");
}

</script>

</body>
</html>
