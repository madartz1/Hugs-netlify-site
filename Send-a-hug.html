<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HUGS</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f2ee;
    color: #222;
}

header {
    background: #fff;
    padding: 25px 20px;
    text-align: left;
}

.logo {
    font-size: 52px;
    font-weight: bold;
    color: #7a3d2c;
    letter-spacing: 2px;
}

.tagline {
    font-size: 22px;
    color: #666;
    margin-top: 8px;
}

nav {
    display: flex;
    flex-wrap: wrap;
    gap: 25px;
    padding: 20px;
    background: #fff;
    font-size: 28px;
    font-weight: bold;
}

nav a {
    text-decoration: none;
    color: #0b2d5b;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 20px;
}

.hero img {
    width: 100%;
    border-radius: 25px;
    display: block;
}

.grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    margin-top: 25px;
}

.card {
    background: #eae3da;
    border-radius: 20px;
    overflow: hidden;
    text-align: center;
    text-decoration: none;
    color: #222;
    box-shadow: 0 4px 10px rgba(0,0,0,0.08);
}

.card img {
    width: 100%;
    height: 260px;
    object-fit: cover;
}

.card-title {
    padding: 14px;
    font-size: 26px;
    font-weight: 500;
}

@media(max-width:768px){
    .logo {
        font-size: 34px;
    }

    .tagline {
        font-size: 16px;
    }

    nav {
        font-size: 18px;
        gap: 14px;
    }

    .grid {
        grid-template-columns: 1fr 1fr;
    }

    .card img {
        height: 180px;
    }

    .card-title {
        font-size: 18px;
    }
}

@media(max-width:500px){
    .grid {
        grid-template-columns: 1fr;
    }
}
</style>
</head>
<body>

<header>
    <div class="logo">HUGS</div>
    <div class="tagline">Help Under Good Service</div>
</header>

<nav>
    <a href="/">Home</a>
    <a href="/shop">Shop</a>
    <a href="/rewards">Receipt Rewards</a>
    <a href="/send-a-hug">Send a Hug</a>
</nav>

<div class="container">

    <a href="YOUR_STRIPE_LINK_MAIN" class="hero">
        <img src="YOUR_IMAGE_URL_MAIN" alt="Main HUGS Image">
    </a>

    <div class="grid">

        <a href="YOUR_STRIPE_LINK_1" class="card">
            <img src="YOUR_IMAGE_URL_1" alt="">
            <div class="card-title">Hug Card</div>
        </a>

        <a href="YOUR_STRIPE_LINK_2" class="card">
            <img src="YOUR_IMAGE_URL_2" alt="">
            <div class="card-title">Gift Box</div>
        </a>

        <a href="YOUR_STRIPE_LINK_3" class="card">
            <img src="YOUR_IMAGE_URL_3" alt="">
            <div class="card-title">Healing Bundle</div>
        </a>

    </div>

</div>

</body>
</html>
