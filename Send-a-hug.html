<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Send A Hug</title>
<style>
    body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        background: #f7f3ee;
    }

    .container {
        max-width: 1200px;
        margin: auto;
        padding: 30px;
    }

    .grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 25px;
    }

    .card {
        position: relative;
        overflow: hidden;
        border-radius: 20px;
        height: 420px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.12);
        transition: transform 0.3s ease;
    }

    .card:hover {
        transform: scale(1.02);
    }

    .card a {
        display: block;
        width: 100%;
        height: 100%;
    }

    .card img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }

    .overlay {
        position: absolute;
        bottom: 0;
        width: 100%;
        padding: 20px;
        background: linear-gradient(to top, rgba(0,0,0,0.65), transparent);
        color: white;
        font-size: 22px;
        font-weight: bold;
        text-align: center;
    }

    @media(max-width:768px){
        .grid{
            grid-template-columns: 1fr;
        }
        .card{
            height: 340px;
        }
    }
</style>
</head>
<body>

<div class="container">
    <div class="grid">

        <!-- Window 1 -->
        <div class="card">
            <a href="YOUR_STRIPE_LINK_1" target="_blank">
                <img src="girl-hoodie.jpg" alt="Send a Hug">
                <div class="overlay">Send a Hug</div>
            </a>
        </div>

        <!-- Window 2 -->
        <div class="card">
            <a href="YOUR_STRIPE_LINK_2" target="_blank">
                <img src="image2.jpg" alt="Gift 2">
                <div class="overlay">Gift 2</div>
            </a>
        </div>

        <!-- Window 3 -->
        <div class="card">
            <a href="YOUR_STRIPE_LINK_3" target="_blank">
                <img src="image3.jpg" alt="Gift 3">
                <div class="overlay">Gift 3</div>
            </a>
        </div>

        <!-- Window 4 -->
        <div class="card">
            <a href="YOUR_STRIPE_LINK_4" target="_blank">
                <img src="image4.jpg" alt="Gift 4">
                <div class="overlay">Gift 4</div>
            </a>
        </div>

    </div>
</div>

</body>
</html>
