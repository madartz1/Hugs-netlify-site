<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Books | HUGS</title>

<style>
body{
    margin:0;
    background:#000;
    color:white;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    text-align:center;
}

.container{
    padding:40px 20px;
    perspective:1200px;
}

.book{
    width:280px;
    margin:auto;
    transform-style:preserve-3d;
    animation:rotateBook 10s ease-in-out infinite;
    filter:drop-shadow(0 0 35px rgba(255,190,90,.35));
}

.book img{
    width:100%;
    border-radius:10px;
    box-shadow:
        0 10px 30px rgba(0,0,0,.8),
        0 0 30px rgba(255,180,70,.25);
}

@keyframes rotateBook{
    0%{
        transform:rotateY(-12deg) translateY(0px);
    }
    25%{
        transform:rotateY(0deg) translateY(-10px);
    }
    50%{
        transform:rotateY(12deg) translateY(0px);
    }
    75%{
        transform:rotateY(0deg) translateY(-10px);
    }
    100%{
        transform:rotateY(-12deg) translateY(0px);
    }
}

.buy-btn{
    display:inline-block;
    margin-top:30px;
    padding:16px 40px;
    background:#d8a646;
    color:#000;
    text-decoration:none;
    border-radius:40px;
    font-weight:bold;
}
</style>
</head>
<body>

<div class="container">

<div class="book">
<img src="images/book-cover.jpg" alt="Book Cover">
</div>

<h1>HUGS Book</h1>

<p>
A powerful story of healing, community, and hope —
created to inspire real people helping real people.
</p>

<a class="buy-btn" href="YOUR_STRIPE_LINK_HERE">
Buy Now
</a>

</div>

</body>
</html>
