<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HUGS Book</title>
<link rel="stylesheet" href="/styles.css">

<style>
body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:radial-gradient(circle at center,#111,#000);
  color:white;
  font-family:Arial,sans-serif;
  overflow:hidden;
}

.books-page{
  text-align:center;
  position:relative;
  z-index:2;
}

.books-page h1{
  font-size:3rem;
  color:#ffd700;
  text-shadow:
    0 0 10px rgba(255,215,0,.6),
    0 0 20px rgba(255,215,0,.4);
  margin-bottom:10px;
}

.books-page p{
  color:#ccc;
  font-size:1.1rem;
  margin-bottom:40px;
}

.book-wrap{
  perspective:1200px;
  display:flex;
  justify-content:center;
  margin-bottom:40px;
}

.book{
  width:260px;
  border-radius:16px;
  box-shadow:
    0 0 30px rgba(255,215,0,.25),
    0 20px 60px rgba(0,0,0,.6);
  animation:floatBook 6s ease-in-out infinite,
            rotateBook 12s linear infinite;
  transform-style:preserve-3d;
}

@keyframes rotateBook{
  0%{ transform:rotateY(-18deg); }
  50%{ transform:rotateY(18deg); }
  100%{ transform:rotateY(-18deg); }
}

@keyframes floatBook{
  0%,100%{ transform:translateY(0); }
  50%{ transform:translateY(-14px); }
}

.buy-book-btn{
  position:relative;
  display:inline-block;
  padding:16px 34px;
  border-radius:14px;
  text-decoration:none;
  font-weight:700;
  color:#111;
  background:linear-gradient(135deg,#ffd700,#ffb300,#fff3b0);
  overflow:hidden;
  box-shadow:
    0 0 14px rgba(255,215,0,.55),
    0 0 28px rgba(255,180,0,.35);
}

.buy-book-btn::before{
  content:"";
  position:absolute;
  top:0;
  left:-80%;
  width:50%;
  height:100%;
  background:linear-gradient(
    120deg,
    rgba(255,255,255,0),
    rgba(255,255,255,.8),
    rgba(255,255,255,0)
  );
  transform:skewX(-25deg);
  animation:shimmer 3s infinite;
}

@keyframes shimmer{
  from{ left:-80%; }
  to{ left:130%; }
}

.buy-book-btn:hover{
  transform:scale(1.04);
}

.gold-particles{
  position:absolute;
  inset:0;
  background-image:
    radial-gradient(circle, rgba(255,215,0,.25) 1px, transparent 1px);
  background-size:60px 60px;
  animation:drift 18s linear infinite;
  z-index:1;
}

@keyframes drift{
  from{ transform:translateY(0); }
  to{ transform:translateY(-60px); }
}
</style>
</head>

<body>

<div class="gold-particles"></div>

<div class="books-page">
  <h1>HUGS Book</h1>
  <p>A powerful story of healing, hope, and community.</p>

  <div class="book-wrap">
    <img src="/images/book-cover.jpg" alt="HUGS Book" class="book">
  </div>

  <a href="https://buy.stripe.com/dRm9ASa56deM7GvaIM8ww00" class="buy-book-btn">Buy Now</a>
</div>

</body>
</html>
