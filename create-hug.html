<!DOCTYPE html>
<html>
<head>
  <title>Your Hug ❤️</title>
  <style>
    body{
      font-family:Arial;
      text-align:center;
      background:#F7F6F3;
      padding:40px;
    }

    .card{
      background:white;
      padding:30px;
      border-radius:20px;
      box-shadow:0 10px 30px rgba(0,0,0,.1);
      max-width:500px;
      margin:auto;
    }

    .btn{
      padding:14px 20px;
      border-radius:999px;
      border:none;
      background:#8B3A2B;
      color:white;
      font-weight:bold;
      cursor:pointer;
      margin-top:15px;
    }

    .link{
      margin-top:15px;
      padding:10px;
      background:#F2E8D8;
      border-radius:12px;
      word-break:break-all;
    }
  </style>
</head>

<body>

<div class="card">

  <h1>❤️ Your Hug is Ready</h1>

  <p>Share this link with someone you care about:</p>

  <div class="link" id="hugLink"></div>

  <button class="btn" onclick="copyLink()">
    Copy & Share Hug
  </button>

</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const hugId = params.get("hug");

  const link = `https://hugslinks.com/hug/${hugId}`;

  document.getElementById("hugLink").innerText = link;

  function copyLink(){
    navigator.clipboard.writeText(link);
    alert("Copied! Share your Hug ❤️");
  }
</script>

</body>
</html>
